[imagemagick]
comment = ImageMagick needed for php-imagemagick extension
paths = /usr/share/ImageMagick-*, /etc/ImageMagick-*, /usr/lib/*/ImageMagick-*, /usr/bin/convert, /usr/bin/mogrify

[java]
comment = Java (openjdk package)
paths = /usr/bin/java, /usr/share/java, /usr/lib/jvm/,  /etc/ld.so.conf*

[pdftk]
comment = pdftk
paths = /usr/bin/pdftk, /usr/share/pdftk/


############################################################################################
################## Custom "ispconfig-advanced-jailkit-tools" sections ######################
############################################################################################

[ps_top_w_uptime]
comment = can run top, ps, w, who, uptime, ping and traceroute ("w", "who", "ping" and "traceroute" are not implemented yet. They will be implemented with a safe-wrappers - with TODO_P12). This appsection works in sinergy with "plugins-available/a_chrooted_website_custom_func.inc.php" and "plugins-available/z_chrooted_website_custom_func.inc.php" to mount the system "proc" in a safe manner for all ISPConfig-created Linux users (mounts "proc" with "hidepid=2,gid=procgroup" in /etc/fstab). Also you must manually add your root and other Linux users to the "procgroup", because by default all new Linux UIDs will have the same limited-access to the "proc" mount. They will be able to see ONLY THEIR OWN PROCESSES. Add to the group the Linux users which you want to see all the system processes.
paths = /bin/ps, /usr/bin/top, /usr/bin/uptime
# We explicitly exclude the local system user database to prevent 'who' leakage
excludepaths = /var/run/utmp, /var/log/wtmp

[dtach]
comment = The dtach CLI utility for detaching from a program, and then re-attaching. Custom version which includes some helper scripts
paths = dtach, pdetachable, pdetachnow, pattach, /usr/lib/x86_64-linux-gnu/libutil.so.1
includesections = ps_top_w_uptime

[jre_headless___openjdk_8_zulu_ca]
comment = Zulu OpenJDK 8 JRE-only and Headless (Custom /opt integration)
paths = /opt/java_custom/jre_headless___openjdk_8_zulu_ca/, /usr/lib/x86_64-linux-gnu/libutil.so.1, /lib/x86_64-linux-gnu/librt.so.1
includesections = extendedshell

# Security fallback
excludepaths = /usr/lib/google-cloud-sdk, /usr/bin/git-credential-gcloud.sh
